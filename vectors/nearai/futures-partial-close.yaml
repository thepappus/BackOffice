id: nearai-futures-partial-close
module: nearai
description: >
  Three contracts opened, one closed mid-life, remaining two carried and marked as
  normal, then closed. Exercises the case where a partial close must leave the
  remainder's 帳入値段 (book price) intact rather than re-basing it, and where the
  closed portion settles at the trade price while the remainder keeps marking to
  the settlement price.
effective_date: 2026-06-03
provenance:
  kind: derived
  source: >
    Follows from the daily mark-to-market rule applied per contract, with
    quantities reduced by 返済 (hensai) closes.
  note: Illustrative prices.

input:
  series:
    product: NK225
    contract_month: "2026-06"
  events:
    - { type: open,       date: 2026-06-01, side: long, quantity: 3, price: "38000" }
    - { type: settlement, date: 2026-06-01, price: "38200" }
    # Close one contract intraday on day two, then mark the remainder that evening.
    - { type: close,      date: 2026-06-02, side: long, quantity: 1, price: "38400" }
    - { type: settlement, date: 2026-06-02, price: "38100" }
    - { type: close,      date: 2026-06-03, side: long, quantity: 2, price: "38600" }

expected:
  marks:
    - { date: 2026-06-01, kind: open_day, side: long, quantity: 3, reference_price: "38000", mark_price: "38200", amount_jpy: 600000 }
    - { date: 2026-06-02, kind: carried,  side: long, quantity: 2, reference_price: "38200", mark_price: "38100", amount_jpy: -200000 }
  closes:
    - date: 2026-06-02
      side: long
      quantity: 1
      open_trade_price: "38000"
      book_price_at_close: "38200"
      close_price: "38400"
      settlement_jpy: 200000
      realized_pnl_jpy: 400000
    - date: 2026-06-03
      side: long
      quantity: 2
      open_trade_price: "38000"
      book_price_at_close: "38100"
      close_price: "38600"
      settlement_jpy: 1000000
      realized_pnl_jpy: 1200000
  total_cash_jpy: 1600000
  total_realized_jpy: 1600000
  invariant_holds: true
