[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jpmarket-ref"
version = "0.1.0"
description = "Open reference implementation of publicly documented Japanese post-trade calculations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jpmarket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
